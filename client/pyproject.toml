[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "psytag"
version = "2026.07.dev5"   # PEP 440-friendly versioning
requires-python = ">=3.8"
description = "Human Behavior Annotation Tool"
readme = "README.md"
license = { text = "Creative Commons Attribution-NonCommercial 4.0 International" }
authors = [{ name="ComPsy Group", email="tuncb@chop.edu" }]
maintainers = [{ name="ComPsy Group", email="tuncb@chop.edu" }]
keywords = ["labeling","annotation","data","psychology","psychiatry","behavior"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "License :: Free for non-commercial use",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]
dependencies = [
  "pydantic",
  "requests",
  "pymongo"
]

[project.urls]
Homepage = "https://github.com/compsygroup/compsy-annotator"
Documentation = "https://github.com/compsygroup/compsy-annotator/wiki"
Issues = "https://github.com/compsygroup/compsy-annotator/issues"

# Tell Hatch which code to put in the wheel
[tool.hatch.build.targets.wheel]
packages = ["src/psytag"]
# include data files inside the package
# include = ["src/psytag/data/*.csv"]

# Optional but nice for source tarball
[tool.hatch.build.targets.sdist]
include = ["src/psytag", "README.md", "pyproject.toml", "LICENSE"]